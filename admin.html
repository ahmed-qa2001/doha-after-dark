<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Doha After Dark - Manage locations</title><link rel="stylesheet" href="/style.css"></head>
<body><main class="admin"><h1>Manage locations</h1><p>Doha After Dark — local CMS prototype</p><p><a href="/">View map</a></p>
<h2 id="form-title">Add a location</h2>
<form id="location-form">
<label for="name">Location name</label><input id="name" name="name" required maxlength="120">
<label for="description">Description</label><textarea id="description" name="description" required maxlength="2000" rows="4"></textarea>
<label for="latitude">Latitude</label><input id="latitude" name="latitude" type="number" min="-90" max="90" step="any" required>
<label for="longitude">Longitude</label><input id="longitude" name="longitude" type="number" min="-180" max="180" step="any" required>
<div class="actions"><button id="save" type="submit">Save location</button><button id="cancel" type="button" hidden>Cancel edit</button></div>
</form><p id="status" role="status" aria-live="polite"></p><h2>Saved locations</h2><div id="locations"></div></main><script src="/admin.js"></script></body></html>
